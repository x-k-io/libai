server:
  port: 11010
spring:
  profiles:
    include: logging
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 128
      max-wait: 3000
      validation-query-timeout: 300
      validation-query: SELECT 'x'
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-password: druid
        login-username: druid
      web-stat-filter:
        session-stat-enable: false
        url-pattern: /*
        exclusions: /static/*,*.ico,/druid/*
mybatis-plus:
  global-config:
    db-config:
      insert-strategy: not_null  # 插入策略：非空才拼接SQL
      update-strategy: not_null # 更新策略：非空才更新

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
  metrics:
    tags:
      application: ${kite.name:libai}
      env: ${kite.env:dev}