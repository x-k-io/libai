dependencies {
    api project(":libai-core")
    // pinyin
    implementation 'io.github.biezhi:TinyPinyin'
    // oss
    implementation 'com.aliyun.oss:aliyun-sdk-oss'
    // sms
    implementation 'com.aliyun:dysmsapi20170525'
    implementation 'com.aliyun:openapiutil'
    // 腾讯云
    implementation 'com.tencentcloudapi:tencentcloud-sdk-java'
    // easy poi
    api 'cn.afterturn:easypoi-web'
    // jwt
    implementation 'io.jsonwebtoken:jjwt-api'
    implementation 'io.jsonwebtoken:jjwt-impl'
    implementation 'io.jsonwebtoken:jjwt-jackson'
}
