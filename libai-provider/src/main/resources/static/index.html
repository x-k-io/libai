<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多美云</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
        }
        .title {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 6px;
            color: #222;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .btn {
            border: 1px solid #222;
            color: #222;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 2px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="title">多美云平台</div>
    <div class="desc">系统运行正常 · 服务已就绪</div>
    <a href="/" class="btn">返回主页</a>
</div>
</body>
</html>
