<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多美云平台 · 监控大盘</title>
  <script src="/echarts.min.js"></script>
  <style>
    :root {
      --body-bg: #0f1117;
      --panel-bg: #181b23;
      --border-color: #2a2e39;
      --text-primary: #e5e7eb;
      --text-secondary: #9ca3af;
      --line1: #60a5fa;
      --line2: #34d399;
      --line3: #fbbf24;
      --line4: #f87171;
      --line5: #a78bfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--body-bg);
      color: var(--text-primary);
      font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      padding: 30px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-title {
      text-align: center;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .source-desc {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 35px;
    }

    /* 顶部指标卡片 */
    .top-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .stat-name {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 26px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* 图表网格 */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .chart-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
    }

    .chart-title {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 15px;
    }

    .chart-box {
      height: 220px;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 40px auto 0;
      padding: 10px 30px;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 4px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: var(--panel-bg);
      color: var(--text-primary);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .top-stats { grid-template-columns: repeat(2,1fr); }
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="page-title">多美云平台 · 监控大盘</h1>
  <p class="source-desc">数据来源：Spring Boot Actuator Prometheus 端点 · 每10秒自动刷新</p>

  <!-- 顶部核心指标卡片 -->
  <div class="top-stats">
    <div class="stat-card">
      <div class="stat-name">服务状态</div>
      <div class="stat-val" style="color:var(--line2)" id="statusVal">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-name">运行时长</div>
      <div class="stat-val" id="uptimeVal">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-name">堆内存使用</div>
      <div class="stat-val" id="heapVal">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-name">活跃线程</div>
      <div class="stat-val" id="threadVal">--</div>
    </div>
  </div>

  <!-- 所有图表面板 -->
  <div class="chart-grid">
    <div class="chart-panel">
      <div class="chart-title">CPU 使用率 & 系统负载</div>
      <div class="chart-box" id="chartCpu"></div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">JVM 堆内存趋势</div>
      <div class="chart-box" id="chartHeap"></div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">线程数量趋势</div>
      <div class="chart-box" id="chartThread"></div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">GC 耗时统计</div>
      <div class="chart-box" id="chartGc"></div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">文件句柄使用</div>
      <div class="chart-box" id="chartFd"></div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">HTTP 请求量</div>
      <div class="chart-box" id="chartHttp"></div>
    </div>
  </div>

  <a href="/" class="back-btn">返回首页</a>
</div>

<script>
  // 初始化所有图表（增加容错处理）
  let chartCpu, chartHeap, chartThread, chartGc, chartFd, chartHttp;
  try {
    chartCpu = echarts.init(document.getElementById('chartCpu'), 'dark');
    chartHeap = echarts.init(document.getElementById('chartHeap'), 'dark');
    chartThread = echarts.init(document.getElementById('chartThread'), 'dark');
    chartGc = echarts.init(document.getElementById('chartGc'), 'dark');
    chartFd = echarts.init(document.getElementById('chartFd'), 'dark');
    chartHttp = echarts.init(document.getElementById('chartHttp'), 'dark');
  } catch (e) {
    console.error('ECharts 初始化失败，请检查 echarts.min.js 文件', e);
  }

  // 存储历史数据
  const maxPoint = 30;
  let timeList = [];
  let cpuList = [], loadList = [];
  let heapList = [];
  let liveThreadList = [], daemonThreadList = [];
  let ygcList = [], fgcList = [];
  let fdOpenList = [];
  let httpReqList = [];

  // 通用折线配置
  function getLineConfig() {
    return {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'axis',
        backgroundColor:'#1f2128',
        borderColor:'#2a2e39',
        textStyle:{color:'#e5e7eb'}
      },
      grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: [],
        axisLine:{lineStyle:{color:'#2a2e39'}},
        axisLabel:{color:'#9ca3af'}
      },
      yAxis: {
        type: 'value',
        splitLine:{lineStyle:{color:'#2a2e39'}},
        axisLabel:{color:'#9ca3af'}
      },
      legend: { textStyle:{color:'#9ca3af'} }
    };
  }

  // 初始化各图表
  if (chartCpu) {
    chartCpu.setOption({
      ...getLineConfig(),
      legend: { data:['CPU使用率','1分钟负载'] },
      series:[
        { name:'CPU使用率',type:'line',smooth:true,data:[],lineStyle:{color:'#60a5fa'},itemStyle:{color:'#60a5fa'} },
        { name:'1分钟负载',type:'line',smooth:true,data:[],lineStyle:{color:'#fbbf24'},itemStyle:{color:'#fbbf24'} }
      ]
    });
  }

  if (chartHeap) {
    chartHeap.setOption({
      ...getLineConfig(),
      legend: { data:['堆内存 MB'] },
      series:[
        { name:'堆内存 MB',type:'line',smooth:true,data:[],lineStyle:{color:'#34d399'},itemStyle:{color:'#34d399'},areaStyle:{color:'rgba(52,211,153,0.1)'} }
      ]
    });
  }

  if (chartThread) {
    chartThread.setOption({
      ...getLineConfig(),
      legend: { data:['活跃线程','守护线程'] },
      series:[
        { name:'活跃线程',type:'line',smooth:true,data:[],lineStyle:{color:'#a78bfa'},itemStyle:{color:'#a78bfa'} },
        { name:'守护线程',type:'line',smooth:true,data:[],lineStyle:{color:'#f87171'},itemStyle:{color:'#f87171'} }
      ]
    });
  }

  if (chartGc) {
    chartGc.setOption({
      ...getLineConfig(),
      legend: { data:['YGC耗时','FGC耗时'] },
      series:[
        { name:'YGC耗时',type:'bar',data:[],itemStyle:{color:'#60a5fa'} },
        { name:'FGC耗时',type:'bar',data:[],itemStyle:{color:'#f87171'} }
      ]
    });
  }

  if (chartFd) {
    chartFd.setOption({
      ...getLineConfig(),
      legend: { data:['已打开文件句柄'] },
      series:[
        { name:'已打开文件句柄',type:'line',smooth:true,data:[],lineStyle:{color:'#fbbf24'},itemStyle:{color:'#fbbf24'} }
      ]
    });
  }

  if (chartHttp) {
    chartHttp.setOption({
      ...getLineConfig(),
      legend: { data:['HTTP总请求数'] },
      series:[
        { name:'HTTP总请求数',type:'line',smooth:true,data:[],lineStyle:{color:'#34d399'},itemStyle:{color:'#34d399'} }
      ]
    });
  }

  // 解析prometheus文本
  function parseMetrics(text){
    let metrics = {};
    let lines = text.split('\n');
    lines.forEach(line=>{
      if(line.startsWith('#') || !line.trim()) return;
      let arr = line.split(' ');
      metrics[arr[0]] = parseFloat(arr[1]);
    });
    return metrics;
  }

  async function pull(){
    try{
      let res = await fetch('/actuator/prometheus');
      if (!res.ok) throw new Error('Prometheus 接口请求失败');
      let text = await res.text();
      let m = parseMetrics(text);

      // 更新状态
      document.getElementById('statusVal').innerText = '正常';

      let now = new Date();
      let t = now.toLocaleTimeString();
      timeList.push(t);
      if(timeList.length>maxPoint) timeList.shift();

      // CPU
      let cpu = (m['process_cpu_usage']||0)*100;
      let load = m['system_load_average_1m']||0;
      cpuList.push(cpu.toFixed(2));
      loadList.push(load.toFixed(2));
      if(cpuList.length>maxPoint) cpuList.shift();
      if(loadList.length>maxPoint) loadList.shift();

      // 堆内存
      let heap = (
              (m['jvm_memory_used_bytes{area="heap",id="PS Survivor Space",}']||0)+
              (m['jvm_memory_used_bytes{area="heap",id="PS Old Gen",}']||0)+
              (m['jvm_memory_used_bytes{area="heap",id="PS Eden Space",}']||0)
      )/1024/1024;
      heapList.push(heap.toFixed(2));
      if(heapList.length>maxPoint) heapList.shift();

      // 线程
      let live = m['jvm_threads_live_threads']||0;
      let daemon = m['jvm_threads_daemon_threads']||0;
      liveThreadList.push(live);
      daemonThreadList.push(daemon);
      if(liveThreadList.length>maxPoint) liveThreadList.shift();
      if(daemonThreadList.length>maxPoint) daemonThreadList.shift();

      // GC
      let ygc = (m['jvm_gc_pause_seconds_sum{action="end of minor GC",cause="Allocation Failure",}']||0)
              + (m['jvm_gc_pause_seconds_sum{action="end of minor GC",cause="Metadata GC Threshold",}']||0);
      let fgc = m['jvm_gc_pause_seconds_sum{action="end of major GC",cause="Metadata GC Threshold",}']||0;
      ygcList.push(ygc.toFixed(3));
      fgcList.push(fgc.toFixed(3));
      if(ygcList.length>maxPoint) ygcList.shift();
      if(fgcList.length>maxPoint) fgcList.shift();

      // 文件句柄
      let fd = m['process_files_open_files']||0;
      fdOpenList.push(fd);
      if(fdOpenList.length>maxPoint) fdOpenList.shift();

      // HTTP简单统计
      let httpCount = 0;
      Object.keys(m).forEach(k=>{
        if(k.startsWith('http_server_requests_seconds_count')) httpCount+=m[k];
      });
      httpReqList.push(httpCount);
      if(httpReqList.length>maxPoint) httpReqList.shift();

      // 顶部数值
      document.getElementById('uptimeVal').innerText = ((m['process_uptime_seconds']||0)/3600).toFixed(1)+' h';
      document.getElementById('heapVal').innerText = heap.toFixed(0)+' MB';
      document.getElementById('threadVal').innerText = live;

      // 刷新所有图表
      if (chartCpu) chartCpu.setOption({xAxis:{data:timeList},series:[{data:cpuList},{data:loadList}]});
      if (chartHeap) chartHeap.setOption({xAxis:{data:timeList},series:[{data:heapList}]});
      if (chartThread) chartThread.setOption({xAxis:{data:timeList},series:[{data:liveThreadList},{data:daemonThreadList}]});
      if (chartGc) chartGc.setOption({xAxis:{data:timeList},series:[{data:ygcList},{data:fgcList}]});
      if (chartFd) chartFd.setOption({xAxis:{data:timeList},series:[{data:fdOpenList}]});
      if (chartHttp) chartHttp.setOption({xAxis:{data:timeList},series:[{data:httpReqList}]});

    }catch(e){
      console.error('监控拉取异常',e);
      document.getElementById('statusVal').innerText = '异常';
      document.getElementById('statusVal').style.color = 'var(--line4)';
    }
  }

  // 自适应
  window.addEventListener('resize',()=>{
    if (chartCpu) chartCpu.resize();
    if (chartHeap) chartHeap.resize();
    if (chartThread) chartThread.resize();
    if (chartGc) chartGc.resize();
    if (chartFd) chartFd.resize();
    if (chartHttp) chartHttp.resize();
  });

  // 启动拉取
  pull();
  setInterval(pull,10000);
</script>
</body>
</html>
