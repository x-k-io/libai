<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
        }
        .num {
            font-size: 72px;
            font-weight: 300;
            color: #222;
            line-height: 1;
            margin-bottom: 20px;
        }
        .text {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .btn {
            border: 1px solid #222;
            color: #222;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 2px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="num">404</div>
    <div class="text">访问路径不存在，请核对地址后重试</div>
    <a href="/" class="btn">返回多美云平台主页</a>
</div>
</body>
</html>
